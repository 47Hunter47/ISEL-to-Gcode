[package]
name = "isel-to-gcode"
version = "2.3.3"
edition = "2024"

[lib]
name = "isel_to_gcode"
path = "src/lib.rs"

[[bin]]
name = "ISEL_to_Gcode"
path = "src/main.rs"

[build-dependencies]
# tauri-build embeds the Win32 resource (icon + version) that the old build.rs
# did by hand with windres; the icon comes from tauri.conf.json bundle.icon.
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.13.1"
rfd = "0.18.0"

[profile.release]
lto = true
strip = true
codegen-units = 1

[patch.crates-io]
# static WebView2 loader on windows-gnu: see vendor/README note in AGENTS.md
webview2-com-sys = { path = "../vendor/webview2-com-sys" }
