[package]
name = "isel-to-gcode"
version = "2.7.2"
edition = "2024"

[lib]
name = "isel_to_gcode"
path = "src/lib.rs"

[[bin]]
name = "ISEL_to_Gcode"
path = "src/main.rs"

# Explorer > Properties > Details: tauri-build fills CompanyName/LegalCopyright
# from bundle.* in tauri.conf.json; OriginalFilename is not covered there, the
# tauri-winres metadata section below is its only knob.
[package.metadata.tauri-winres]
OriginalFilename = "ISEL_to_Gcode.exe"

[build-dependencies]
# tauri-build embeds the Win32 resource (icon + version) that the old build.rs
# did by hand with windres; the icon comes from tauri.conf.json bundle.icon.
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.13.1"
rfd = "0.18.0"

# The tauri CLI turns this on by hand; a plain `cargo build` does not, and
# without it the exe skips the embedded UI and loads devUrl (localhost:1420).
[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
strip = true
codegen-units = 1

[patch.crates-io]
# static WebView2 loader on windows-gnu: see vendor/README note in AGENTS.md
webview2-com-sys = { path = "../vendor/webview2-com-sys" }
