name: CodeQL

# Default setup cannot analyze Rust (its language enum lacks `rust`, measured
# 26.11.2026: 422 on PATCH) AND it rejects SARIF from custom workflows while
# enabled ("CodeQL analyses from advanced configurations cannot be processed
# when the default setup is enabled", measured 26.11.2026). So default setup
# is off and this file analyzes everything the old default setup covered,
# plus Rust, in one job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1" # weekly: analyses stay fresh even without pushes

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # init must run before the steps to analyze: the actions extractor only
      # traces action invocations that execute after init (advanced mode;
      # measured: with late init the actions database is empty and analyze
      # fails with exit 32 "could not process any of it")
      - uses: github/codeql-action/init@v3
        with:
          languages: rust, javascript-typescript, actions, c-cpp

      - run: rustup toolchain install stable-x86_64-pc-windows-gnu --no-self-update --profile minimal
      - run: echo "C:\\mingw64\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # dist/ must exist: the tauri build script embeds it and fails the
      # traced build without it (same order as CI's build job)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: traced build
        run: cargo build
        working-directory: src-tauri

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:rust"
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:actions"
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp"
