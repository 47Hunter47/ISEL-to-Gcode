name: Build Windows EXE
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync version from release tag
        run: python sync_version.py

      - name: Commit version files back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.py version_info.txt
          if git diff --cached --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "chore: sync version from release tag"
            git checkout main
            git cherry-pick HEAD@{1}
            git push origin main
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller tkinterdnd2 numpy

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --icon=icon.ico --collect-all tkinterdnd2 --hidden-import=numpy --version-file=version_info.txt --name ISEL_to_Gcode isel_to_gcode_gui.py

      - name: Upload EXE
        uses: actions/upload-artifact@v6
        with:
          name: ISEL_to_Gcode_EXE
          path: dist/ISEL_to_Gcode.exe
          retention-days: 7
