name: Build Windows EXE
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
env:
  # ref name goes through env, never interpolated into the shell, so an odd tag
  # name cannot inject commands
  REF_NAME: ${{ github.ref_name }}
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins a fully-qualified channel; rustup only accepts
      # that when the toolchain already exists, so install it explicitly.
      - run: rustup toolchain install stable-x86_64-pc-windows-gnu --no-self-update --profile minimal

      # GNU target needs binutils (as/dlltool); the runner image ships C:\mingw64.
      - run: echo "C:\\mingw64\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Version (release tag must match Cargo.toml; dispatch uses Cargo.toml)
        id: ver
        run: |
          $tag = $env:REF_NAME -replace '^v', ''
          $cargo = ((Get-Content Cargo.toml | Select-String -Pattern '^version = ' | Select-Object -First 1) -replace '^version = "(.*)"', '$1')
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            if ($tag -notmatch '^\d+(\.\d+)*$') {
              Write-Error "Release tag '$env:REF_NAME' is not a version - tag the release as vX.Y.Z"
              exit 1
            }
            if ($tag -ne $cargo) {
              Write-Error "Tag v$tag but Cargo.toml says $cargo - bump Cargo.toml before tagging"
              exit 1
            }
            $ver = $tag
          } else {
            $ver = $cargo
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "Using version $ver"

      - run: cargo test
      - run: cargo build --release

      - name: Upload EXE
        uses: actions/upload-artifact@v6
        with:
          name: ISEL_to_Gcode_v${{ steps.ver.outputs.version }}
          path: rust/target/release/ISEL_to_Gcode.exe
          retention-days: 7

      - name: Attach EXE to release
        if: github.event_name == 'release'
        run: gh release upload "$env:REF_NAME" target/release/ISEL_to_Gcode.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
