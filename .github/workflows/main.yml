name: Release
# Every push to main publishes the version that is in Cargo.toml: the tag is
# derived from the file, never typed, so it cannot drift. A push that did not
# bump the version finds the release already there and stops before the build,
# so docs-only pushes cost seconds and never re-publish.
# A release published by hand still works: it only attaches the exe to it.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
env:
  # ref name goes through env, never interpolated into the shell, so an odd tag
  # name cannot inject commands
  REF_NAME: ${{ github.ref_name }}
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins a fully-qualified channel; rustup only accepts
      # that when the toolchain already exists, so install it explicitly.
      - run: rustup toolchain install stable-x86_64-pc-windows-gnu --no-self-update --profile minimal

      # GNU target needs binutils (as/dlltool); the runner image ships C:\mingw64.
      - run: echo "C:\\mingw64\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Version (release tag must match Cargo.toml; a push uses Cargo.toml)
        id: ver
        run: |
          $tag = $env:REF_NAME -replace '^v', ''
          $cargo = ((Get-Content Cargo.toml | Select-String -Pattern '^version = ' | Select-Object -First 1) -replace '^version = "(.*)"', '$1')
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            if ($tag -notmatch '^\d+(\.\d+)*$') {
              Write-Error "Release tag '$env:REF_NAME' is not a version - tag the release as vX.Y.Z"
              exit 1
            }
            if ($tag -ne $cargo) {
              Write-Error "Tag v$tag but Cargo.toml says $cargo - bump Cargo.toml before tagging"
              exit 1
            }
            $ver = $tag
          } else {
            $ver = $cargo
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "Using version $ver"

      - name: Skip when this version is already released
        id: check
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ steps.ver.outputs.version }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "v${{ steps.ver.outputs.version }} is already published - nothing to do"
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          # a missing release leaves $LASTEXITCODE=1, which would fail the step
          exit 0

      # rust-toolchain.toml pins a fully-qualified channel; rustup only accepts
      # that when the toolchain already exists, so install it explicitly.
      - if: steps.check.outputs.skip != 'true'
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --no-self-update --profile minimal

      # GNU target needs binutils (as/dlltool); the runner image ships C:\mingw64.
      - if: steps.check.outputs.skip != 'true'
        run: echo "C:\\mingw64\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - if: steps.check.outputs.skip != 'true'
        run: npm ci

      # dist/ must exist before cargo build: the exe embeds it
      - if: steps.check.outputs.skip != 'true'
        run: npm run build

      - if: steps.check.outputs.skip != 'true'
        run: cargo test

      - if: steps.check.outputs.skip != 'true'
        run: cargo build --release --features custom-protocol

      - name: Upload EXE
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ISEL_to_Gcode_v${{ steps.ver.outputs.version }}
          path: src-tauri/target/release/ISEL_to_Gcode.exe
          retention-days: 7

      # The tag is created here, at the commit that was built, so a release can
      # never point at code other than the exe attached to it. A tag that already
      # exists (its release was deleted, then pushed again) is reused instead —
      # passing --target for an existing tag makes gh fail.
      - name: Create release and attach EXE
        if: github.event_name == 'push' && steps.check.outputs.skip != 'true'
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          git ls-remote --exit-code --tags origin $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "$tag already exists - publishing a release for it"
            gh release create $tag target/release/ISEL_to_Gcode.exe --title $tag --generate-notes
          } else {
            gh release create $tag target/release/ISEL_to_Gcode.exe --target "${{ github.sha }}" --title $tag --generate-notes
          }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Attach EXE to a hand-made release
        if: github.event_name == 'release' && steps.check.outputs.skip != 'true'
        run: gh release upload "$env:REF_NAME" target/release/ISEL_to_Gcode.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
